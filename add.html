  function b64(b) { var s = '', i, n; for (i = 0; i < b.length; i += 3) { n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0); s += B64.charAt(n >> 18) + B64.charAt((n >> 12) & 63) + (i + 1 < b.length ? B64.charAt((n >> 6) & 63) : '') + (i + 2 < b.length ? B64.charAt(n & 63) : ''); } return s; }

(function () {
  function $(i) { return document.getElementById(i); }
  var h = (location.hash || '').replace(/^#/, '').split('.'), topic = h[0], keyHex = h[1], type = 'x';
  if (!/^omar[0-9a-f]{16}$/.test(topic || '') || !/^[0-9a-f]{32}$/.test(keyHex || '')) { $('bad').style.display = 'block'; $('form').style.display = 'none'; return; }
  var key = OmarX.hex2b(keyHex);
  function tab(t) { type = t; $('tx').className = t === 'x' ? 'on' : ''; $('tm').className = t === 'm' ? 'on' : ''; $('xf').style.display = t === 'x' ? '' : 'none'; $('mf').style.display = t === 'm' ? '' : 'none'; }

  $('go').onclick = function () {
    var o = { t: type, name: $('name').value.trim() };
